[project]
name = "reality-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.33.0",
    "mujoco>=3.17.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
